pull_request_rules:
  - name: merge [bot] PRs when CI pass
    conditions:
      - check-success = "check-macos-linux-nix"
      - check-success = "check-build"
      - check-success = "check-package"
      - check-success = "pre-commit.ci - pr"
      - or:
          # github does not allow to self-approve PRs (even for owners)...
          - approved-reviews-by = arntanguy
          # ... so we use '@mergifyio merge' comment on prs by @arntanguy
          - and:
              - comment-author = arntanguy
              - comment-body ~ = (?i)@mergifyio (merge|queue)
          - author = dependabot[bot]
          - author = gepetto-flake-updater[bot]
          - author = mc-rtc-nixpkgs-flake-updater[bot]
          - author = github-actions[bot]
          - author = pre-commit-ci[bot]
    actions:
      merge:
merge_queue:
  queue_controls_comment: false
