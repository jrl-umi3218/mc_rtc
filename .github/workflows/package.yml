---
name: Package mc_rtc
on:
  repository_dispatch:
    types:
    - package-master
    - package-release
  push:
    branches:
    - "master"
    tags:
    - v*
  pull_request:
    branches:
    - "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          package:
            - '.github/workflows/package.yml'
            - 'benchmarks/**'
            - 'binding/**'
            - 'debian/**'
            - 'doc/**'
            - 'include/'
            - 'src/**'
            - 'tests/**'
            - 'utils/**'
            - 'CMakeLists.txt'
  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: jrl-umi3218/github-actions/.github/workflows/package-project.yml@master
    with:
      deps: '["jrl-umi3218/mc_rtc_ros", "jrl-umi3218/mc_openrtm", "jrl-umi3218/mc_udp", "jrl-umi3218/mc_panda", "jrl-umi3218/mc_state_observation"]'
      with-ros: true
      latest-cmake: true
      free-disk-space: true
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
  check:
    if: always()
    name: check-package
    runs-on: ubuntu-latest
    needs:
      - package
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: package # accept skipped builds as success
