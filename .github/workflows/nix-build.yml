name: Nix Build Reusable
on:
  workflow_call:
    inputs:
      ref:
        description: Commit ref to checkout
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          code:
            - '.github/workflows/nix-build.yml'
            - 'benchmarks/**'
            - 'binding/**'
            # XXX: doc only needs build for json schemas, and even there
            # it's only for cmake install paths injection
            # we should define more fine-grained rules here
            - 'doc/**'
            - 'include/'
            - 'src/**'
            - 'tests/**'
            - 'utils/**'
            - 'CMakeLists.txt'
            - 'flake.nix'
            - 'flake.lock'
  nix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      CACHIX_AUTH_TOKEN: ${{secrets.CACHIX_AUTH_TOKEN}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ccache: [true, false]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: mc-rtc-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: ros,gepetto
      - name: Determine Variant Arguments
        id: flags
        run: |
          ARGS=
          if [[ ${{ matrix.ccache }} == true ]]; then
            ARGS=--override-input\ ccache-trigger\ github:boolean-option/true
          else
            ARGS=--override-input\ ccache-trigger\ github:boolean-option/false
          fi
          echo args=$(echo $ARGS | xargs) >> $GITHUB_OUTPUT
      - if: ${{ matrix.ccache == true }}
        name: Setup ccache environment
        run: |
          sudo mkdir -m0770 -p /var/cache/ccache
          if [[ $RUNNER_OS == macOS ]]; then
            owner_group=$(stat -f %Su:%Sg /nix/store)
          else
            owner_group=$(stat -c %U:%G /nix/store)
          fi
          sudo chown $owner_group /var/cache/ccache
          mkdir -p ~/.config/nix
          echo extra-sandbox-paths = /var/cache/ccache | sudo tee -a /etc/nix/nix.conf
          if command -v systemctl &> /dev/null; then
            sudo systemctl restart nix-daemon.service
          fi
          sudo ls -ld /var/cache/ccache
      - run: nix flake check -L ${{ steps.flags.outputs.args }}
      - run: nix build -L ${{ steps.flags.outputs.args }}
      - name: Copy Closure
        if: ${{ env.CACHIX_AUTH_TOKEN == '' }}
        run: |
          mkdir -p ./nix-result-closure
          nix-store --copy-closure $(readlink -f ./result) ./nix-result-closure
      - name: Upload Build Result
        if: ${{ env.CACHIX_AUTH_TOKEN == '' }}
        uses: actions/upload-artifact@v3
        with:
          name: nix-build-result
          path: ./nix-result-closure
