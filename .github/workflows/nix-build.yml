name: Nix Build Reusable
on:
  workflow_call:
    inputs:
      ref:
        description: Commit ref to checkout
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
jobs:
  nix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ccache: [true, false]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: mc-rtc-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: ros,gepetto
      - name: Determine Variant Arguments
        id: flags
        run: |
          ARGS=
          if [[ ${{ matrix.ccache }} == true ]]; then
            ARGS=--override-input\ ccache-trigger\ github:boolean-option/true
          else
            ARGS=--override-input\ ccache-trigger\ github:boolean-option/false
          fi
          echo args=$(echo $ARGS | xargs) >> $GITHUB_OUTPUT
      - if: ${{ matrix.ccache == true }}
        name: Setup ccache environment
        run: |
          sudo mkdir -m0770 -p /var/cache/ccache
          if [[ $RUNNER_OS == macOS ]]; then
            owner_group=$(stat -f %Su:%Sg /nix/store)
          else
            owner_group=$(stat -c %U:%G /nix/store)
          fi
          sudo chown $owner_group /var/cache/ccache
          mkdir -p ~/.config/nix
          echo extra-sandbox-paths = /var/cache/ccache | sudo tee -a /etc/nix/nix.conf
          if command -v systemctl &> /dev/null; then
            sudo systemctl restart nix-daemon.service
          fi
          sudo ls -ld /var/cache/ccache
      - run: nix flake check -L ${{ steps.flags.outputs.args }}
      - run: nix build -L ${{ steps.flags.outputs.args }}
  check:
    if: always()
    name: check-macos-linux-nix
    runs-on: ubuntu-latest
    needs:
      - nix
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
